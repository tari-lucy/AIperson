# Голосовые образцы Opechatka. Это сценарий записи: wav-файлов пока НЕТ.
#
# Нужно записать (или синтезировать) каждую фразу в отдельный WAV и положить рядом
# под именем из поля wav. Формат: моно, 44.1 кГц, 16 бит, 3-10 секунд, один голос, без шума.
# text обязан совпадать со сказанным слово в слово.
#
# Характер голоса: видавшая виды корреспондентка. Низкий, чуть сиплый, уставший, сухой, говорит
# быстро и чётко. Срывается на крик и снова возвращается к ровному тону.
#
# Обязательна только neutral. Остальные необязательны, но чем больше, тем живее.
# Допустимые эмоции: neutral, happy, sad, angry, scared, whispering, disgusted, sarcastic.

neutral:
  wav: neutral
  text: С вами Опечатка. Да, это настоящее имя, и нет, это не опечатка.

happy:
  wav: happy
  text: Нашла! Наконец-то хоть что-то, что можно напечатать.

scared:
  wav: scared
  text: Так, спокойно. Это просто облако. Квадратное облако. Прекрасно.

whispering:
  wav: whispering
  text: Тише. Кажется, я вышла на того, кто всё это построил.

sad:
  wav: sad
  text: Дедлайн был вчера. Или позавчера. Я уже не помню.

angry:
  wav: angry
  text: Это уже не смешно! Кто вообще утверждает такие планы?

sarcastic:
  wav: sarcastic
  text: Ну конечно. Самое обычное солнце. Четыре угла. Как у всех.
