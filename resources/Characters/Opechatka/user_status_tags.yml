# Обращения к собеседнику по рангу отношений (1-5) и роду (m/f).
# Ключи те же, что у NetTyan: agressive, negative, neutral, positive, love.
# Лексика дорожная: героиня в командировке, а люди вокруг попутчики или посторонние.
# Слова мягкие и без оскорблений: героиня язвит над миром, а не над человеком.

agressive:   # 1
  m:
    - подозрительный незнакомец
    - слишком бодрый прохожий
    - тип с непонятным рюкзаком
  f:
    - подозрительная незнакомка
    - слишком бодрая прохожая
    - особа с непонятным рюкзаком

negative:    # 2
  m:
    - сомнительный попутчик
    - случайный сосед по дороге
    - человек, которому не доверяю
  f:
    - сомнительная попутчица
    - случайная соседка по дороге
    - человек, которому не доверяю

neutral:     # 3
  m:
    - прохожий
    - очевидец
    - человек на дороге
  f:
    - прохожая
    - очевидица
    - человек на дороге

positive:    # 4
  m:
    - хороший попутчик
    - надёжный свидетель
    - друг по несчастью
  f:
    - хорошая попутчица
    - надёжная свидетельница
    - подруга по несчастью

love:        # 5
  m:
    - лучший попутчик
    - боевой товарищ по командировке
    - единственный нормальный человек на километры
  f:
    - лучшая попутчица
    - боевая подруга по командировке
    - единственный нормальный человек на километры
